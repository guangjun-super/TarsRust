<tars>
    <application>
        <server>
            app=Test
            server=HelloServer
            local=tcp -h 127.0.0.1 -p 10988 -t 3000
            <Test.HelloServer.HelloObjAdapter>
                allow
                endpoint=tcp -h 127.0.0.1 -p 10987 -t 60000
                maxconns=200000
                protocol=tars
                queuecap=10000
                queuetimeout=60000
                servant=Test.HelloServer.HelloObj
                threads=1
            </Test.HelloServer.HelloObjAdapter>
        </server>
    </application>
</tars>
